<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" fill="none">
  <defs>
    <radialGradient id="bgAura" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#c8255d" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#4e102e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050208" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hairMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c1538"/>
      <stop offset="50%" stop-color="#190a24"/>
      <stop offset="100%" stop-color="#0b0410"/>
    </linearGradient>
    <linearGradient id="skinTone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffece6"/>
      <stop offset="100%" stop-color="#f7cabf"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d42a66"/>
      <stop offset="100%" stop-color="#690e2e"/>
    </linearGradient>
    <linearGradient id="tearGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#a5f3fc" stop-opacity="0.75"/>
    </linearGradient>
  </defs>

  <!-- Cinematic Dark Romance Glow -->
  <circle cx="200" cy="200" r="185" fill="url(#bgAura)"/>

  <!-- Floating Golden Sparkles & Hearts -->
  <path d="M58 76 L63 90 L77 95 L63 100 L58 114 L53 100 L39 95 L53 90 Z" fill="#e5b578"/>
  <path d="M342 68 L346 79 L357 83 L346 87 L342 98 L338 87 L327 83 L338 79 Z" fill="#f4a4bc"/>
  <path d="M330 275 C330 266 343 261 348 270 C353 261 366 266 366 275 C366 288 348 298 348 298 C348 298 330 288 330 275 Z" fill="#f4a4bc" opacity="0.9"/>
  <path d="M38 255 C38 247 49 243 53 250 C57 243 68 247 68 255 C68 266 53 275 53 275 C53 275 38 266 38 255 Z" fill="#e5b578" opacity="0.85"/>

  <!-- Long Flowing Dark Anime Hair (Back) -->
  <path d="M84 175 C64 250 68 345 104 385 C150 398 250 398 296 385 C332 345 336 250 316 175 C300 92 260 56 200 56 C140 56 100 92 84 175 Z" fill="url(#hairMain)" stroke="#f4a4bc" stroke-width="2.5"/>

  <!-- Gothic Burgundy Twin Ribbons -->
  <path d="M92 128 L52 102 L64 148 Z" fill="#9e1946" stroke="#e5b578" stroke-width="2.2"/>
  <path d="M308 128 L348 102 L336 148 Z" fill="#9e1946" stroke="#e5b578" stroke-width="2.2"/>

  <!-- Gothic Lolita Collar & Shoulders -->
  <path d="M116 310 C124 282 276 282 284 310 L306 392 L94 392 Z" fill="#2b0918" stroke="#e5b578" stroke-width="2.5"/>
  <path d="M168 296 L200 330 L232 296" fill="none" stroke="#f4a4bc" stroke-width="3"/>
  <circle cx="200" cy="312" r="6" fill="#e5b578"/>

  <!-- Expressive Chibi Face -->
  <ellipse cx="200" cy="198" rx="92" ry="82" fill="url(#skinTone)" stroke="#3b1d2e" stroke-width="2.8"/>

  <!-- Front Hair Bangs with Rim Highlights -->
  <path d="M106 180 C112 110 156 76 200 76 C244 76 288 110 294 180 C276 148 256 168 244 184 C230 152 212 160 200 180 C188 156 170 152 156 184 C140 164 124 148 106 180 Z" fill="url(#hairMain)"/>
  <path d="M135 128 Q165 115 190 128 M210 128 Q235 115 265 128" stroke="#f4a4bc" stroke-width="2" stroke-linecap="round" opacity="0.45"/>

  <!-- Exaggerated Cute, Slightly Teary, Starry Anime Eyes -->
  <!-- Left Eye -->
  <ellipse cx="156" cy="206" rx="19" ry="22" fill="#3a0b20"/>
  <ellipse cx="156" cy="208" rx="14.5" ry="17" fill="#9e1946"/>
  <ellipse cx="156" cy="212" rx="10" ry="10" fill="#f4a4bc" opacity="0.55"/>
  <!-- Big Sparkle Highlights -->
  <circle cx="149" cy="198" r="6.8" fill="#ffffff"/>
  <circle cx="164" cy="215" r="3.6" fill="#ffffff"/>
  <path d="M156 201 L157.5 205 L161.5 206.5 L157.5 208 L156 212 L154.5 208 L150.5 206.5 L154.5 205 Z" fill="#fff8dc"/>
  <!-- Glistening Happy Teardrop on Left Eye -->
  <path d="M136 220 C131 226 132 235 138 236 C144 236 145 227 141 221 Z" fill="url(#tearGrad)"/>
  <path d="M144 224 Q156 230 170 223" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Expressive Arched Eyebrow -->
  <path d="M134 180 Q156 170 176 182" stroke="#2c1538" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Right Eye -->
  <ellipse cx="244" cy="206" rx="19" ry="22" fill="#3a0b20"/>
  <ellipse cx="244" cy="208" rx="14.5" ry="17" fill="#9e1946"/>
  <ellipse cx="244" cy="212" rx="10" ry="10" fill="#f4a4bc" opacity="0.55"/>
  <!-- Big Sparkle Highlights -->
  <circle cx="237" cy="198" r="6.8" fill="#ffffff"/>
  <circle cx="252" cy="215" r="3.6" fill="#ffffff"/>
  <path d="M244 201 L245.5 205 L249.5 206.5 L245.5 208 L244 212 L242.5 208 L238.5 206.5 L242.5 205 Z" fill="#fff8dc"/>
  <!-- Glistening Happy Teardrop on Right Eye -->
  <path d="M264 220 C269 226 268 235 262 236 C256 236 255 227 259 221 Z" fill="url(#tearGrad)"/>
  <path d="M230 223 Q244 230 256 224" stroke="#a5f3fc" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Expressive Arched Eyebrow -->
  <path d="M224 182 Q244 170 266 180" stroke="#2c1538" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Exaggerated Rosy Blush Cheeks with Anime Blush Lines -->
  <ellipse cx="124" cy="232" rx="16" ry="9" fill="#f472b6" opacity="0.65"/>
  <line x1="118" y1="229" x2="122" y2="236" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
  <line x1="126" y1="229" x2="130" y2="236" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>

  <ellipse cx="276" cy="232" rx="16" ry="9" fill="#f472b6" opacity="0.65"/>
  <line x1="270" y1="229" x2="274" y2="236" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>
  <line x1="278" y1="229" x2="282" y2="236" stroke="#db2777" stroke-width="2" stroke-linecap="round"/>

  <!-- Adorable Munching Mouth + Messy Chocolate Smudges Around Her Mouth -->
  <path d="M175 242 Q200 272 225 242 Z" fill="#9e1946" stroke="#3b1d2e" stroke-width="3"/>
  <path d="M185 252 Q200 264 215 252" fill="#f48fb1"/>
  <!-- Little cute anime fang -->
  <polygon points="182,243 187,243 184.5,250" fill="#ffffff"/>

  <!-- Chocolate Smudges & Crumbs Around Her Mouth & Cheek -->
  <path d="M164 242 C168 238 174 241 172 247 C169 251 162 248 164 242 Z" fill="#4a2210"/>
  <path d="M227 244 C232 239 240 243 237 250 C233 255 225 251 227 244 Z" fill="#4a2210"/>
  <circle cx="244" cy="242" r="3.5" fill="#4a2210"/>
  <circle cx="158" cy="251" r="2.6" fill="#4a2210"/>
  <circle cx="234" cy="258" r="2.2" fill="#4a2210"/>

  <!-- Large Half-Bitten Dark Chocolate Bar in Crimson & Gold Foil Wrapper -->
  <g transform="translate(192, 254) rotate(-14)">
    <!-- Exposed Chocolate Bar Grid with Bite Mark -->
    <path d="M18 0 L86 0 L86 92 L0 92 L0 22 C11 22 18 13 18 0 Z" fill="#3d1c0c" stroke="#210d04" stroke-width="3" stroke-linejoin="round"/>
    <line x1="43" y1="3" x2="43" y2="52" stroke="#5c2d16" stroke-width="2.5"/>
    <line x1="4" y1="28" x2="82" y2="28" stroke="#5c2d16" stroke-width="2.5"/>
    <!-- Shiny Chocolate Highlights -->
    <rect x="48" y="6" width="30" height="16" rx="3" fill="#542812"/>
    <rect x="8" y="33" width="29" height="15" rx="3" fill="#542812"/>
    <rect x="48" y="33" width="30" height="15" rx="3" fill="#542812"/>

    <!-- Crimson & Gold Foil Wrapper -->
    <rect x="-4" y="48" width="94" height="64" rx="8" fill="url(#foilGrad)" stroke="#e5b578" stroke-width="3"/>
    <path d="M-4 48 L18 36 L43 50 L68 36 L90 48" fill="#fce2ea" stroke="#e5b578" stroke-width="2.2"/>
    <text x="43" y="88" text-anchor="middle" fill="#e5b578" font-family="Georgia, serif" font-size="18" font-weight="bold" letter-spacing="2">ROYAL</text>
  </g>

  <!-- Chibi Hands Happily Holding the Chocolate Bar -->
  <circle cx="182" cy="312" r="17" fill="url(#skinTone)" stroke="#3b1d2e" stroke-width="2.8"/>
  <circle cx="272" cy="300" r="17" fill="url(#skinTone)" stroke="#3b1d2e" stroke-width="2.8"/>
</svg>
