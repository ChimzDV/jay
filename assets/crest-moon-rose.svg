<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d693"/>
      <stop offset="50%" stop-color="#d49b4b"/>
      <stop offset="100%" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a2b8"/>
      <stop offset="45%" stop-color="#a82049"/>
      <stop offset="100%" stop-color="#45081b"/>
    </linearGradient>
  </defs>
  <!-- Outer Astrological Ring -->
  <circle cx="100" cy="100" r="88" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.6"/>
  <circle cx="100" cy="100" r="78" stroke="#f4a2b8" stroke-width="0.8" opacity="0.35"/>
  <!-- Crescent Moon -->
  <path d="M115 32 A68 68 0 1 0 155 148 A54 54 0 1 1 115 32 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Stylized Gothic Rose Center -->
  <g transform="translate(98, 102)">
    <path d="M0 -30 C18 -30 28 -12 20 8 C12 24 -12 24 -20 8 C-28 -12 -18 -30 0 -30 Z" fill="url(#roseGrad)" stroke="#f4a2b8" stroke-width="1.2"/>
    <path d="M0 -20 C12 -20 18 -6 11 6 C5 15 -8 15 -12 5 C-17 -6 -10 -18 0 -18" fill="none" stroke="#f7d6e0" stroke-width="1.2" opacity="0.85"/>
    <path d="M0 -10 C6 -10 9 -2 5 4 C1 8 -5 7 -6 2 C-8 -3 -3 -8 1 -8" fill="none" stroke="#f5d693" stroke-width="1.2"/>
    <!-- Thorns / Leaves -->
    <path d="M0 22 L0 56" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
    <path d="M0 34 C-12 28 -22 34 -16 42 C-10 46 -4 40 0 34 Z" fill="#6b1530" stroke="url(#goldGrad)" stroke-width="1"/>
    <path d="M0 42 C12 36 22 42 16 50 C10 54 4 48 0 42 Z" fill="#6b1530" stroke="url(#goldGrad)" stroke-width="1"/>
  </g>
  <!-- Four-point stars -->
  <path d="M135 55 L138 63 L146 66 L138 69 L135 77 L132 69 L124 66 L132 63 Z" fill="#f7d6e0"/>
  <path d="M56 54 L57.5 59 L62.5 60.5 L57.5 62 L56 67 L54.5 62 L49.5 60.5 L54.5 59 Z" fill="#f5d693" opacity="0.8"/>
</svg>
